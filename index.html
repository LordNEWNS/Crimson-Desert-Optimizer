<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyss Gear Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>

    <div id="page-wrapper">

      <header id="site-header">
        <h1 id="site-title">ABYSS GEAR CALCULATOR</h1>
        <p id="site-subtitle">// crimson desert — Abyss Gear Optimizer</p>
      </header>

      <main id="main-content">

        <section id="input-panel">
          <h2 class="panel-heading">// INPUT</h2>

          <div id="input-grid">
            <div class="input-group">
              <label class="input-label" for="Attack-level">ATTACK LEVEL</label>
              <input class="input-field" type="number" id="Attack-level" min="1" value="1" placeholder="1">
            </div>
            <div class="input-group">
              <label class="input-label" for="Crit-level">CRIT LEVEL</label>
              <input class="input-field" type="number" id="Crit-level" min="0" max="15" value="0" placeholder="0">
            </div>
            <div class="input-group">
              <label class="input-label" for="Attack-Speed-level">SPEED LEVEL</label>
              <input class="input-field" type="number" id="Attack-Speed-level" min="0" max="15" value="0" placeholder="0">
            </div>
            <div class="input-group">
              <label class="input-label" for="Crit-Multiplier">CRIT MULTIPLIER</label>
              <input class="input-field" type="number" id="Crit-Multiplier" min="1" step="0.1" value="2.0" placeholder="2.0">
            </div>
            <div class="input-group">
              <label class="input-label" for="Avail-Gem-Slots">ABYSS SLOTS</label>
              <input class="input-field" type="number" id="Avail-Gem-Slots" min="1" value="3" placeholder="3">
            </div>
          </div>

          <button id="calculate-button" onclick="displayResults()">OPTIMIZE</button>
        </section>

        <section id="results-panel">
          <h2 class="panel-heading">// RESULTS</h2>
          <div id="results-container">
            <p id="results-placeholder">awaiting input...</p>
          </div>
        </section>

      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
